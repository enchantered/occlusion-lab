name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test core without credentials or network services
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q venturelab projects tests
  sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned optional SDK dependencies
        run: python -m pip install -r requirements-agent.lock
      - name: Require SDK imports so compatibility tests cannot silently skip
        run: python -c "import agents; from projects.reviewgate.agent_adapter import _sdk_types; _sdk_types()"
      - name: Exercise real SDK with synthetic offline model, never a provider API
        run: python -m unittest discover -s tests -p test_sdk_compatibility.py -v
